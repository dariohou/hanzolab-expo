name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        type: choice
        options:
          - gtg
          - qigong
          - walking

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @hanzolab/${{ inputs.app }} web:build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Create release directory
        run: |
          ssh ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }} \
            "mkdir -p /var/www/${{ inputs.app }}/releases/$(date +%Y%m%d%H%M%S)"

      - name: Deploy new release
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          user: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_VPS_KEY }}
          source: 'apps/${{ inputs.app }}/dist/*'
          target: /var/www/${{ inputs.app }}/current/

      - name: Verify deployment
        run: |
          ssh ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }} \
            "curl -f https://${{ inputs.app }}.hanzolab.com/health || exit 1"
